syntax = "proto3";

package deployerpb;

option go_package = "muvon/proto/deployerpb";

// DeployerService is muvon-deployer's gRPC API for container introspection
// and live log streaming. It speaks only over the /run/muvon/deployer.sock
// Unix socket that muvon admin dials. Docker socket access stays inside
// muvon-deployer; admin reaches it through this narrow surface.
service DeployerService {
  // ListContainers returns active and recently started containers. The
  // filters apply to managed-only or to every container. The admin UI's
  // "Live tail" picker calls this.
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);

  // GetContainer returns the state and label snapshot for one container.
  rpc GetContainer(GetContainerRequest) returns (ContainerDetail);

  // StreamContainerLogs connects to the Docker daemon with
  // `?follow=1&timestamps=1`, demultiplexes the stream and sends each line as
  // its own message. For a slow consumer the server applies drop-oldest
  // backpressure and reports the loss with a synthetic
  // "[muvon] dropped N lines" line.
  rpc StreamContainerLogs(StreamContainerLogsRequest) returns (stream ContainerLogChunk);

  // Health is a simple liveness probe. The admin UI ties its "deployer down"
  // banner to this failing.
  rpc Health(HealthRequest) returns (HealthResponse);

  // SystemUpgrade starts the pull-and-recreate flow, returning one event per
  // step on the stream (pull, backup, restart, done). The admin endpoint
  // POST /api/system/upgrade proxies this call and reflects the events to the
  // UI over SSE.
  rpc SystemUpgrade(SystemUpgradeRequest) returns (stream UpgradeEvent);

  // CreateBackup takes a pg_dump -Fc and verifies it, independently of an
  // upgrade, so a backup can be taken before any risky work rather than only
  // as a side effect of upgrading.
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse);

  // ListBackups returns the backups on disk, newest first.
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
}

// ===== Backups =====

message CreateBackupRequest {}

message CreateBackupResponse {
  string path       = 1;  // full path of the written file
  int64  bytes      = 2;
  string created_at = 3;  // RFC3339
  // Verified reports that the pg_restore -l check passed. When false, note
  // carries the reason: the file was still written, but do not trust it
  // blindly.
  bool   verified   = 4;
  string note       = 5;
}

message BackupInfo {
  string name       = 1;
  int64  bytes      = 2;
  string created_at = 3;  // RFC3339
}

message ListBackupsRequest {}

message ListBackupsResponse {
  repeated BackupInfo backups = 1;
  // KeepLimit says how many backups are retained. The UI shows it so that
  // the disappearance of older files is never a mystery.
  int32 keep_limit = 2;
}

// ===== ListContainers =====

message ListContainersRequest {
  // managed_only=true restricts the result to containers labelled
  // muvon.managed=true.
  bool   managed_only = 1;
  string project      = 2;
  string component    = 3;
  // state is one of "", "running" or "exited"; empty means both.
  string state        = 4;
}

message ListContainersResponse {
  repeated ContainerDetail containers = 1;
}

// ===== GetContainer =====

message GetContainerRequest {
  string container_id = 1;  // full ID or a prefix
}

message ContainerDetail {
  string container_id   = 1;
  string container_name = 2;
  string image          = 3;
  string image_digest   = 4;
  // state is one of Docker's canonical values: created, running, paused,
  // restarting, removing, exited, dead.
  string state          = 5;
  // status is the human-readable sentence Docker shows, for example
  // "Up 5 minutes (healthy)".
  string status         = 6;
  map<string, string> labels = 7;
  // RFC3339; when the container started (State.StartedAt while Up).
  string started_at     = 8;
  // RFC3339; State.FinishedAt if it exited, empty for a running container.
  string finished_at    = 9;
  int32  exit_code      = 10;
  // Label-derived fields pulled out of Inspect, so the admin UI can fill its
  // search fields without parsing labels itself.
  string project        = 11;  // muvon.project
  string component      = 12;  // muvon.component
  string release_id     = 13;  // muvon.release_id
}

// ===== StreamContainerLogs =====

message StreamContainerLogsRequest {
  string container_id = 1;
  // tail is how many trailing lines to send on connect; 0 means new lines
  // only; a negative value means the whole existing log, which is expensive
  // to start with and should not be used.
  int32  tail         = 2;
  // follow=true keeps the stream open and keeps sending new lines until the
  // container ends.
  bool   follow       = 3;
  // streams: empty means "stdout,stderr", otherwise filter to what is asked
  // for. This maps to the Docker API setting; the server default is
  // stdout plus stderr.
  repeated string streams = 4;
  // since is RFC3339: send only lines after that time. Empty falls back to
  // docker logs' own default behaviour.
  string since        = 5;
}

message ContainerLogChunk {
  // timestamp is the RFC3339Nano value the Docker daemon supplies.
  string timestamp = 1;
  // stream is "stdout" or "stderr", taken from the multiplexed stream header.
  string stream    = 2;
  // line is a single log line with its newline stripped.
  string line      = 3;
  // truncated=true means the source line exceeded max_line and the server
  // split it. The UI may join such lines with an ellipsis.
  bool   truncated = 4;
  // seq is a monotonic counter inside the server's tail goroutine, used to
  // order two lines that share the same microsecond.
  int64  seq       = 5;
  // synthetic=true means muvon produced the line itself (for example
  // "dropped N lines"). The UI may render those differently.
  bool   synthetic = 6;
}

// ===== Health =====

message HealthRequest {}

message HealthResponse {
  // ok=true means the deployer and its Docker daemon access are working.
  bool ok = 1;
  // last_tick_age_seconds is how long ago the deployer's last tick ran.
  // 0 means unknown.
  int64 last_tick_age_seconds = 2;
  // active_tail_streams is how many StreamContainerLogs calls are live.
  int32 active_tail_streams = 3;
  // shipper_active_containers is how many containers logship is tailing for
  // persistence.
  int32 shipper_active_containers = 4;
}

// ===== SystemUpgrade =====

message SystemUpgradeRequest {
  // target_tag is ":latest" (the default), ":v0.1.0" and so on. It is
  // written to the VERSION variable in compose's .env and the pull follows
  // that tag.
  string target_tag = 1;
  // take_backup=true takes a pg_dump before the pull.
  bool   take_backup = 2;
}

message UpgradeEvent {
  // step ∈ {locked, pre_check, backup, pull, restart, post_check, done, failed}
  string step      = 1;
  // level ∈ {info, warn, error}
  string level     = 2;
  // A human-readable message, either captured from stdout or written here.
  string message   = 3;
  // RFC3339; set by the backend.
  string timestamp = 4;
  // done=true marks the final event. The stream closes after it.
  bool   done      = 5;
}
