# Agent host: the agent binary
# Update:
#   docker compose -f docker-compose.agent.yml pull && \
#   docker compose -f docker-compose.agent.yml up -d
#
# Or re-run install-agent.sh, which is idempotent.

services:
  agent:
    image: ghcr.io/saidmuratozdemir/muvon/agent:latest
    restart: unless-stopped
    # This container is also the edge proxy. The label is how the deployer
    # finds the address it injects into backend containers as MUVON_EDGE_IP.
    # An application uses that address as the gate before trusting X-Real-IP;
    # do not enable the server's own proxy-header handling (docs/client-ip.md).
    labels:
      muvon.role: edge
    ports:
      - "80:80"
      - "443:443"
      # Deployer gRPC over TCP: the port central dials for live container
      # log tail. AGENT_DEPLOYER_TCP_BIND takes two shapes:
      #
      #   "<host>:9100"   host-side bind to a single interface. Preferred:
      #                   an internal address (provider private network,
      #                   VPC subnet, or a VPN mesh interface such as
      #                   Tailscale or Wireguard). Zero public surface.
      #   "9100"          bind to every interface (0.0.0.0:9100). On a host
      #                   with a public IP, allow 9100/tcp only from
      #                   central's address in the provider firewall.
      #
      # Token verification (an HKDF-derived bearer) is mandatory either way,
      # so a firewall is defence in depth rather than the only control.
      - "${AGENT_DEPLOYER_TCP_BIND:-9100}:9100"
    environment:
      AGENT_CENTRAL_URL: ${AGENT_CENTRAL_URL:?required}
      AGENT_API_KEY: ${AGENT_API_KEY:?required}
      AGENT_LOG_ADDR: ${AGENT_LOG_ADDR:-}
      AGENT_LOG_LEVEL: ${LOG_LEVEL:-info}
      # Self-reported public IP — central uses this as the DNS target.
      # Empty disables the X-Agent-Public-IP header (central falls back
      # to last_remote_addr, useful for non-NAT setups).
      AGENT_PUBLIC_IP: ${AGENT_PUBLIC_IP:-}
      # Host path where install-agent.sh keeps this compose file. The
      # agent.self_upgrade handler spawns a docker:cli helper container
      # that bind-mounts this directory and runs `compose up` to
      # recreate itself with the freshly pulled image.
      MUVON_HOST_AGENT_DIR: ${MUVON_AGENT_DIR:-/opt/muvon-agent}

      # ── Fail-soft startup config cache ─────────────────────────────
      # During a central outage the agent starts from stale-but-working
      # config and reconnects in the background. Volume mounted below.
      AGENT_CONFIG_CACHE: /var/lib/agent/config.json

      # ── Container log shipping (dockerwatch) ─────────────────────────
      # When the docker socket is mounted below, the agent ships every
      # container's stdout/stderr to central dialog-siem over the same
      # AGENT_LOG_ADDR connection. host_id defaults to "agent:<hostname>"
      # — set AGENT_HOST_ID to override (e.g. a friendly customer name).
      AGENT_DOCKERWATCH_ENABLED: ${AGENT_DOCKERWATCH_ENABLED:-true}
      AGENT_HOST_ID: ${AGENT_HOST_ID:-}
      AGENT_DOCKERWATCH_MANAGED_ONLY: ${AGENT_DOCKERWATCH_MANAGED_ONLY:-false}

      # ── Embedded edge deployer (opt-in) ─────────────────────────────
      # Set this to true and the agent brings up the components assigned to
      # its own `agent_id` over the local Docker socket. It shares the
      # central deployer's code; the difference is that state is kept over
      # HTTP. To enable it:
      #   1. mount /var/run/docker.sock read-write (below)
      #   2. AGENT_ENCRYPTION_KEY must be IDENTICAL to central's
      #      MUVON_ENCRYPTION_KEY. With the deployer on and the key empty
      #      the agent refuses to start: a deployer that cannot decrypt
      #      secret env would surface the mistake months later, inside a
      #      deployment.
      AGENT_DEPLOYER_ENABLED: ${AGENT_DEPLOYER_ENABLED:-false}
      AGENT_DEPLOYER_POLL_MS: ${AGENT_DEPLOYER_POLL_MS:-5000}
      AGENT_ENCRYPTION_KEY: ${AGENT_ENCRYPTION_KEY:-}
      # Cloudflare client-IP trust (opt-in). When this zone is proxied (orange
      # cloud), set this to a secret you ALSO inject via a CF Transform Rule on
      # the zone (header AGENT_CLOUDFLARE_IP_HEADER, default X-Muvon-CF-Key).
      # The agent then trusts CF-Connecting-IP only when that secret matches.
      # Empty = Cloudflare client-IP trust disabled (safe default).
      AGENT_CLOUDFLARE_IP_SECRET: ${AGENT_CLOUDFLARE_IP_SECRET:-}
      AGENT_CLOUDFLARE_IP_HEADER: ${AGENT_CLOUDFLARE_IP_HEADER:-}
      # Bind inside the container — keep at 0.0.0.0:9100; the host-side
      # bind in `ports:` decides which interface is exposed externally.
      AGENT_DEPLOYER_TCP_LISTEN: ${AGENT_DEPLOYER_TCP_LISTEN:-0.0.0.0:9100}

    volumes:
      - tls_cache:/var/lib/agent/tls           # AGENT_TLS_CACHE default path
      - logship:/var/lib/agent/logship           # spool when central is unreachable
      - config_cache:/var/lib/agent              # fail-soft startup cache

      # ── Docker socket mount ──────────────────────────────────────────
      # Pick a mode:
      #   :ro   dockerwatch only (container log shipping). The agent can
      #         tail containers but cannot start or stop them.
      #   ""    dockerwatch plus the embedded deployer, which needs
      #         read-write because it calls ImagePull, ContainerCreate
      #         and ContainerStart.
      # install-agent.sh writes the right line for the selected mode.
      #
      # - /var/run/docker.sock:/var/run/docker.sock:ro

      # ── Registry credentials (private GHCR or Docker Hub) ────────────
      # With the embedded deployer on, ImagePull calls /images/create and
      # reads the X-Registry-Auth header from ~/.docker/config.json. Without
      # that file inside the container the pull goes anonymous and private
      # images return 401. Mount the host's root config read-only;
      # install-agent.sh uncomments this line when the edge deployer is
      # enabled.
      #
      # - /root/.docker/config.json:/root/.docker/config.json:ro

      # ── Operator env files (deploy_components.env_file_path) ─────────
      # The embedded deployer reads the file at the host path named by a
      # component's env_file_path and injects its contents as env vars. It
      # is not a mount, so file permissions do not bind the container user,
      # but the agent container does need to see the path. Convention: keep
      # every env file under /opt/envfiles/, which this compose reaches with
      # one read-only mount. The central muvon-deployer has the same layout.
      # install-agent.sh uncomments this line and creates the directory when
      # the edge deployer is enabled.
      #
      # - /opt/envfiles:/opt/envfiles:ro

volumes:
  tls_cache:
  logship:
  config_cache:
