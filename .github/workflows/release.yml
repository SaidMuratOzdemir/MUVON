name: Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/muvon

jobs:
  # Gate: nothing is published unless this passes. The images are what
  # operators upgrade to with one click, so a red test must stop the tag from
  # ever existing rather than be noticed afterwards.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # -race because the hot paths here are concurrent (log pipelines, the
      # config holder, the deploy loop) and a data race in them is exactly the
      # kind of defect that only shows up under production load.
      - name: go test
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [muvon, dialog-siem, agent, muvon-deployer]

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          # Three-tier SemVer plus commit-sha and branch tags:
          # - A v1.2.3 tag publishes :1.2.3, :1.2, :1 and :latest, so an
          #   operator can pin VERSION=v1.2.3 (patch), VERSION=v1.2 (minor)
          #   or VERSION=latest and stay as conservative as they want.
          # - A main push produces only :sha-XXXXXXX and the branch name.
          # :latest moves only on a v tag push. Main pushes stay dev
          # artifacts, which keeps :latest pointing at the newest official
          # release: the panel compares the running digest against it, and
          # the same commit pushed to main and as a tag can otherwise
          # produce two different digests.
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Compute VERSION
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(cat VERSION 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # A tag push also creates the GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
