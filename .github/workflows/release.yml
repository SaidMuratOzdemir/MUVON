name: Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/muvon

jobs:
  # Gate: nothing is published unless this passes. The images are what
  # operators upgrade to with one click, so a red test must stop the tag from
  # ever existing rather than be noticed afterwards.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # embed.go embeds frontend/dist, which is generated rather than
      # committed. The build job gets it from the Dockerfile's UI stage, so a
      # job running Go directly on the runner has to produce it the same way:
      # without it every Go command fails on the embed pattern before it can
      # look at a line of Go. Building it here also means vet and the tests
      # see the binary that actually ships.
      - name: Build UI
        run: |
          npm --prefix ui ci --prefer-offline
          make ui-build

      # The panel is half the product and had no gate of its own, so a lint
      # error could reach an image while four Go gates stayed green.
      - name: eslint
        run: npm --prefix ui run lint

      - name: go vet
        run: go vet ./...

      # -race because the hot paths here are concurrent (log pipelines, the
      # config holder, the deploy loop) and a data race in them is exactly the
      # kind of defect that only shows up under production load.
      - name: go test
        run: go test -race -count=1 ./...

      # Pinned like govulncheck: an unpinned linter turns an unrelated release
      # into a red build the day it gains a check.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # Two tests cover what unit tests cannot reach: a pg_dump taken through the
  # exec stream that really restores, and retention statements applied to a
  # real Timescale job catalog. Both skip themselves without their env var, so
  # without this job they exist and never run. No UI build here: neither
  # package pulls in the root package's embedded SPA.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start databases
        run: |
          docker run -d --name muvon-it-pg \
            -e POSTGRES_PASSWORD=test -e POSTGRES_DB=muvon -e POSTGRES_USER=muvon \
            postgres:18-alpine
          docker run -d --name muvon-it-ts \
            -e POSTGRES_PASSWORD=test -e POSTGRES_DB=muvon -e POSTGRES_USER=muvon \
            -p 55432:5432 timescale/timescaledb:latest-pg17
          for _ in $(seq 1 60); do
            if docker exec muvon-it-pg pg_isready -U muvon -d muvon >/dev/null 2>&1 \
               && docker exec muvon-it-ts pg_isready -U muvon -d muvon >/dev/null 2>&1; then
              echo "both ready"
              exit 0
            fi
            sleep 2
          done
          echo "databases did not become ready in time" >&2
          docker logs --tail 20 muvon-it-pg >&2 || true
          docker logs --tail 20 muvon-it-ts >&2 || true
          exit 1

      # Asserts the dump carries its newlines and that pg_restore accepts it.
      - name: Backup restores
        env:
          MUVON_TEST_PG_CONTAINER: muvon-it-pg
        run: go test ./internal/deployer -run TestContainerExecStreamProducesRestorableDump -v

      - name: Retention reaches the job catalog
        env:
          MUVON_TEST_PG_DSN: postgres://muvon:test@localhost:55432/muvon?sslmode=disable
        run: go test ./internal/db -run TestApplyRetentionAgainstTimescale -v

      # Deleting the wrong image takes down whatever is running on it, so the
      # rules that decide what may be pruned run against a real planner.
      - name: Image prune keeps what is in use
        env:
          MUVON_TEST_PG_DSN: postgres://muvon:test@localhost:55432/muvon?sslmode=disable
        run: go test ./internal/db -run TestListPrunableImages -v

  build:
    needs: [verify, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [muvon, dialog-siem, agent, muvon-deployer]

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          # Three-tier SemVer plus commit-sha and branch tags:
          # - A v1.2.3 tag publishes :1.2.3, :1.2, :1 and :latest, so an
          #   operator can pin VERSION=v1.2.3 (patch), VERSION=v1.2 (minor)
          #   or VERSION=latest and stay as conservative as they want.
          # - A main push produces only :sha-XXXXXXX and the branch name.
          # :latest moves only on a v tag push. Main pushes stay dev
          # artifacts, which keeps :latest pointing at the newest official
          # release: the panel compares the running digest against it, and
          # the same commit pushed to main and as a tag can otherwise
          # produce two different digests.
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Compute VERSION
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(cat VERSION 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          fi

      # Built into the local daemon first so the scan happens before the push.
      # A gate that runs afterwards has already handed operators the image it
      # objects to. The push step below reuses this build from the cache.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
          load: true
          tags: scan-target:${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # govulncheck in the verify job asks whether a vulnerability is
      # reachable from this code; this asks whether it is present in the
      # shipped binary at all. The two disagree on purpose, and the second
      # question is the one an operator scanning our images will ask.
      # Unfixed findings are skipped: they are noise until upstream ships
      # something to move to.
      - name: Scan image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            scan-target:${{ matrix.service }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # A tag push also creates the GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
